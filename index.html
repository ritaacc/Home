fu('浴缸',-325,-250,320,515,0,55,'#f0ece4');fu('馬桶',-215,-175,330,360,0,40,'#f5f5f5');fu('室外機',100,155,-110,-60,0,70,'#cfcfcf');
items.push({id:++id,t:'p',n:'人 170cm',x:620,z:100,w:40,d:40,h:170,y:0,r:0,c:'#3f78b5'})}
const PR={牆:['w',200,10,260,0,'#f7f3ea'],門:['d',90,4,210,0,'#a88b66'],窗:['g',120,6,130,90,'#bcd6e0'],櫃子:['f',100,45,85,0,'#d9d0c0'],床:['f',150,190,48,0,'#efe9de'],沙發:['f',267,95,60,0,'#dcd2c4'],桌:['f',120,80,75,0,'#a89f92'],椅子:['f',42,42,90,0,'#c9b9a0'],電視櫃:['f',180,45,45,0,'#e9e1d3'],系統櫃整排:['f',280,45,240,0,'#e8dfd0'],地板:['v',300,300,2,-2,'#cdb89a']};
function mk(it){if(M[it.id])S.remove(M[it.id]);let m;
if(it.t=='p'){m=new T.Group();const a=new T.Mesh(new T.CylinderGeometry(20,16,145,20),new T.MeshLambertMaterial({color:it.c})),h=new T.Mesh(new T.SphereGeometry(12.5,20,16),new T.MeshLambertMaterial({color:0xf0c9a4}));a.position.y=72.5;h.position.y=157.5;m.add(a,h);m.children.forEach(o=>o.userData.id=it.id)}
else{m=new T.Mesh(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial({color:it.c,transparent:it.t=='w'||it.t=='g',opacity:it.t=='w'?.5:it.t=='g'?.35:1,depthWrite:it.t!='w'&&it.t!='g'}));m.userData.id=it.id}
S.add(m);M[it.id]=m;up(it)}
function up(it){const m=M[it.id];m.position.set(it.x,it.t=='p'?0:it.y+it.h/2,it.z);if(it.t=='p'){m.scale.y=it.h/170;return}m.scale.set(it.w,it.h,it.d);m.rotation.y=-it.r*Math.PI/180;m.material.color.set(it.c)}
function build(){Object.values(M).forEach(m=>S.remove(m));M={};items.forEach(mk);fillList();pick2(null)}
function sv(){try{localStorage.setItem(KEY,JSON.stringify({items,id}))}catch(e){}}
const cur=()=>items.find(i=>i.id==sel),F=['x','z','w','d','h','y','r'],FN={x:'x位置',z:'z位置',w:'長',d:'深',h:'高',y:'離地',r:'旋轉°'};
$('g').innerHTML=F.map(k=>`<label>${FN[k]}<input type="number" step="5" inputmode="decimal" data-k="${k}"></label>`).join('');
document.querySelectorAll('#g input').forEach(e=>e.oninput=()=>{const it=cur();if(!it||e.value==='')return;it[e.dataset.k]=+e.value;up(it);sv()});
$('n').oninput=e=>{const it=cur();if(it){it.n=e.target.value;fillList(true);sv()}};
$('c1').oninput=e=>{const it=cur();if(it){it.c=e.target.value;if(it.t=='p')mk(it);else up(it);hl();sv()}};

function hl(){Object.keys(M).forEach(k=>M[k].traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.setHex(k==sel?0x2a6a9a:0)}))}

ctl.maxPolarAngle=Math.PI/2.02;
const rc=new T.Raycaster(),pl=new T.Plane(new T.Vector3(0,1,0),0),pt=new T.Vector3();let dn=null,dg=null;
function ray(e){const r=R.domElement.getBoundingClientRect();rc.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),cam)}
function hit(e){ray(e);const h=rc.intersectObjects(S.children,true).find(o=>{const k=o.object.userData.id;const it=k&&items.find(i=>i.id==k);return it&&it.t!='v'});return h?h.object.userData.id:null}
R.domElement.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,t:Date.now()};if(!mv)return;const k=hit(e);if(!k)return;pick2(k);const it=cur();ray(e);rc.ray.intersectPlane(pl,pt);dg={ox:it.x-pt.x,oz:it.z-pt.z};ctl.enabled=false},true);
